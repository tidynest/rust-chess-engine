# cargo-deny configuration. Run with `cargo deny check`.
#
# cargo-deny does not report unsound-only advisories and resolves the graph
# for the host target, so this list is only what it can match on Linux CI.

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is the latest release and ab_glyph, via egui, requires it" },
]

[bans]
# Two windows-sys generations sit under eframe (glutin and winit on 0.52 and
# 0.59, arboard on 0.60). Warning about them on every run prints hundreds of
# lines and nothing here can change it before egui 0.36.
multiple-versions = "allow"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
