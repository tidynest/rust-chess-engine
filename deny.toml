# cargo-deny configuration. Run with `cargo deny check`.
#
# cargo-deny resolves the graph for the host target, so this list is only
# what it can match on Linux CI.

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is the latest release and ab_glyph, via egui, requires it" },
    # zbus 6 absorbed these three crates, but accesskit_unix 0.24.1, the newest,
    # still needs zbus 5. Drop them once eframe's accesskit moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained and comes in through eframe's accesskit" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained and comes in through eframe's accesskit" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained and comes in through eframe's accesskit" },
]

[bans]
# Four windows-sys versions, 0.52 to 0.61, sit under eframe, tokio and the
# crates they pull in. Warning about them on every run prints hundreds of
# lines, and nothing in this workspace can change that.
multiple-versions = "allow"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
