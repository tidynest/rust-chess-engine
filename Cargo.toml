[workspace]
members = [
    "crates/chess-core",
    "crates/chess-engine",
    "crates/chess-desktop",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tidynest/rust-chess-engine"

[workspace.dependencies]
anyhow = "1.0.102"
cozy-chess = "0.3.4"
thiserror = "2.0.18"

egui = "0.36.2"
eframe = "0.36.2"

# One child-process pipe; no need for net, fs, signal.
tokio = { version = "1.52.0", features = ["rt", "process", "io-util", "sync", "time", "macros"] }

env_logger = "0.11.10"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
# Always fix these
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Improve these
complexity = "warn"
perf = "warn"
style = "warn"

# Performance critical for chess
cast_lossless = "warn"
inefficient_to_string = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"

# Safety critical
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Code quality
unnecessary_wraps = "warn"

# egui and its stack are slow unoptimised; the project's own crates stay
# debuggable at the default level.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
